:root{
  --navy:#0B2B3C;--navy-2:#123A4F;--navy-3:#1D4B62;--green:#067455;--green-d:#055C44;--mint:#47D7AC;--mint-2:#8BE6C9;
  --tint:#DFF6EE;--wash:#F3FBF8;--line:#D3E3DD;--line-2:#E6EEEA;--ink:#17242D;--ink-2:#34434E;--grey:#56636D;--muted:#7B8891;--faint:#A9B4BB;
  --amber:#9A6412;--amber-t:#FDF3E1;--red:#C0303D;--red-t:#FBEAEC;--blue:#1F5F8B;--blue-t:#E7F0F6;
  --sh-1:0 1px 2px rgba(11,43,60,.06),0 1px 3px rgba(11,43,60,.05);
  --sh-2:0 6px 16px -6px rgba(11,43,60,.14),0 2px 5px -2px rgba(11,43,60,.06);
  --sh-3:0 24px 48px -16px rgba(11,43,60,.35),0 8px 18px -8px rgba(11,43,60,.16);
  --f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--ink);background:#F4F8F6;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;height:48px;font-size:13px}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;font-size:14px}
.topbar .disc{color:#B9CAD3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.seg a{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;color:#CFDCE3;font-weight:600;white-space:nowrap}
.seg a.on{background:#fff;color:var(--navy)}
.tlink{display:flex;align-items:center;gap:6px;color:#CFDCE3;font-weight:600;white-space:nowrap;padding:6px 8px;border-radius:8px}
.tlink:hover{background:rgba(255,255,255,.08);color:#fff}
.logo{width:26px;height:26px;border-radius:8px;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:10.5px;letter-spacing:.02em;flex:none}
.logo.lg{width:34px;height:34px;border-radius:10px;font-size:12.5px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 24px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;box-shadow:var(--sh-2);transition:transform .15s var(--ease),box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-3)}
.btn.sec{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.btn .ic{width:18px;height:18px}

/* ---------- landing ---------- */
.land{max-width:1220px;margin:0 auto;padding:30px 28px 40px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:calc(100vh - 160px)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--tint);color:var(--green-d);font-weight:650;font-size:13px;border-radius:999px;padding:6px 12px}
.hero h1{font-size:58px;line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:18px 0 18px;color:var(--navy)}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p.sub{font-size:19px;line-height:1.5;color:var(--ink-2);max-width:560px}
.ctas{display:flex;gap:14px;margin:28px 0 18px;flex-wrap:wrap}
.notes{display:flex;gap:18px;flex-wrap:wrap;color:var(--grey);font-size:14px}
.notes span{display:flex;align-items:center;gap:6px}
.notes .ic{color:var(--green)}
.heroart{position:relative;display:grid;place-items:center;min-height:640px}
.heroart .phone{transform:rotate(-3deg) scale(.86)}
.float{position:absolute;background:#fff;border-radius:16px;box-shadow:var(--sh-3);padding:12px 15px;font-size:13px;color:var(--grey);z-index:3}
.float b{display:block;color:var(--navy);font-size:18px;letter-spacing:-.01em;margin-top:2px}
.float .ic{color:var(--green)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.how div{background:#fff;border:1px solid var(--line-2);border-radius:18px;padding:20px;box-shadow:var(--sh-1)}
.how .n{width:30px;height:30px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:12px}
.how h3{font-size:17px;margin-bottom:6px;color:var(--navy)}
.how p{font-size:14.5px;color:var(--grey)}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.55}

/* ---------- guided demo ---------- */
.demo{max-width:1240px;margin:0 auto;padding:20px 24px 30px}
.story{background:var(--navy);color:#fff;border-radius:22px;padding:18px 20px;display:grid;grid-template-columns:44px 1fr auto 44px;gap:18px;align-items:center;box-shadow:var(--sh-3)}
.story .arrow{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);color:#fff}
.story .arrow.next{background:#fff;color:var(--navy)}
.story .arrow[disabled]{opacity:.3;cursor:default}
.story .arrow .ic{width:20px;height:20px}
.story .k{font-size:12.5px;color:#9FB7C4;font-weight:600;letter-spacing:.01em}
.story h2{font-size:21px;letter-spacing:-.015em;margin:2px 0 4px}
.story p{font-size:14.5px;color:#DCE7EC;max-width:720px}
.story .before{font-size:13px;color:#F3A7AE;margin-top:6px}
.story .before s{color:#F7C4C9}
.forxyz{margin-top:10px;display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.07);border-radius:12px;padding:9px 12px;font-size:14px;color:#E8F0F3;max-width:760px}
.forxyz b{white-space:nowrap;color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.tag.trust{background:var(--mint);color:var(--navy)}
.tag.adopt{background:#FFE3A3;color:#5C3D00}
.tag.data{background:#BFE3F7;color:#0E3C57}
.tag.guard{background:#F6C9CF;color:#6A1520}
.tag.speed{background:#D9D2FA;color:#2D1F73}
.tag.rel{background:#C9F0E3;color:#044434}
.dots{display:flex;gap:5px;align-items:center}
.dots button{width:8px;height:8px;border-radius:99px;background:#46667A}
.dots button.done{background:#8DB3C5}
.dots button.on{width:26px;background:#fff}
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:30px;margin-top:22px;align-items:start}
.side{background:#fff;border:1px solid var(--line-2);border-radius:20px;padding:12px;box-shadow:var(--sh-1);align-self:start}
.side h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px 8px}
.gi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:10px;font-size:14px;color:var(--grey);text-align:left}
.gi:hover{background:var(--wash)}
.gi .d{width:22px;height:22px;border-radius:7px;background:#EEF3F1;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);flex:none}
.gi.done .d{background:var(--tint);color:var(--green)}
.gi.on{background:var(--tint);color:var(--navy);font-weight:650}
.gi.on .d{background:var(--navy);color:#fff}
.gi .stg{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.persona{display:flex;gap:12px;align-items:center;padding:8px}
.persona .av{width:52px;height:52px;border-radius:50%;flex:none;overflow:hidden}
.persona b{display:block;font-size:16px;color:var(--navy)}
.persona span{font-size:13px;color:var(--grey);line-height:1.35;display:block}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:600;color:var(--grey)}
.hint{font-size:12.5px;color:var(--muted);padding:10px 8px 4px;line-height:1.5}

/* ---------- phone ---------- */
.pwrap{width:calc(390px * var(--ps,1));height:calc(844px * var(--ps,1));position:relative;flex:none}
.pwrap .phone{position:absolute;left:0;top:0;transform:scale(var(--ps,1));transform-origin:top left}
.phone{width:390px;height:844px;border-radius:58px;background:#0E1A21;padding:12px;box-shadow:var(--sh-3),inset 0 0 0 2px #2B3A42;position:relative;flex:none}
.phone::before{content:"";position:absolute;right:-3px;top:180px;width:3px;height:74px;background:#1D2A31;border-radius:0 3px 3px 0}
.screen{width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#0E1A21;z-index:20}
.sb{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:650;z-index:10}
.sb .r{display:flex;gap:6px;align-items:center}
.sb svg{display:block}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scr::-webkit-scrollbar{display:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:#0E1A21;z-index:30;opacity:.9}
.dark .homebar{background:#fff}
.cta{flex:none;padding:12px 16px 26px;background:#fff;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px;position:relative}
.cta .b{height:50px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cta .b.green{background:var(--green)}
.cta .b2{height:42px;border-radius:12px;color:var(--navy);font-weight:650;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;box-shadow:inset 0 0 0 1.5px var(--line)}
.cta .b .ic{width:18px;height:18px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(71,215,172,.65)}50%{box-shadow:0 0 0 8px rgba(71,215,172,0)}}
.coach{position:absolute;z-index:40;background:var(--mint);color:var(--navy);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:var(--sh-3);display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
.coach::after{content:"";position:absolute;width:12px;height:12px;background:var(--mint);transform:rotate(45deg);left:50%;margin-left:-6px;bottom:-5px}
.coach.up::after{bottom:auto;top:-5px}
.coach .ic{width:15px;height:15px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.shot .coach{display:none}.shot .pulse{animation:none}

/* ---------- in-app building blocks ---------- */
.ah{display:flex;align-items:center;gap:10px;padding:6px 16px 12px}
.ah .back{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#F1F5F3;color:var(--navy)}
.ah .t{font-weight:700;font-size:16.5px;color:var(--navy);letter-spacing:-.01em;line-height:1.15}
.ah .s{font-size:12.5px;color:var(--muted);font-weight:500}
.ah .sp{flex:1}
.pad{padding:0 16px 18px}
.h1{font-size:25px;font-weight:800;letter-spacing:-.025em;color:var(--navy);line-height:1.12;margin:2px 0 6px}
.lead{font-size:14px;color:var(--grey);line-height:1.45}
.card{background:#fff;border:1px solid var(--line-2);border-radius:18px;padding:14px;box-shadow:var(--sh-1)}
.card+.card,.card+.block,.block+.card,.block+.block{margin-top:10px}
.block{margin-top:10px}
.lbl{font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.row span{color:var(--grey)}
.row b{color:var(--ink);font-variant-numeric:tabular-nums}
.row.big b{font-size:20px;color:var(--navy)}
.hr{height:1px;background:var(--line-2);margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:650;background:#EEF3F1;color:var(--ink-2);white-space:nowrap}
.chip.g{background:var(--tint);color:var(--green-d)}
.chip.a{background:var(--amber-t);color:var(--amber)}
.chip.r{background:var(--red-t);color:var(--red)}
.chip.b{background:var(--blue-t);color:var(--blue)}
.chip.n{background:var(--navy);color:#fff}
.chip .ic{width:13px;height:13px}
.li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);padding:6px 0;line-height:1.4}
.li .i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--green)}
.li .i.no{background:var(--red-t);color:var(--red)}
.li .i .ic{width:15px;height:15px}
.li b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:14px;padding:10px 10px 11px;background:#F4F8F6}
.tile span{display:block;font-size:11.5px;color:var(--grey);line-height:1.25;font-weight:550}
.tile b{display:block;font-size:19px;color:var(--navy);letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile.hi{background:var(--navy)}
.tile.hi span{color:#A9C3CF}.tile.hi b{color:var(--mint)}
.bar{display:flex;height:34px;border-radius:11px;overflow:hidden;font-size:13px;font-weight:700}
.bar div{display:grid;place-items:center;transition:flex .3s var(--ease);min-width:0;white-space:nowrap}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--grey)}
.keys span{display:flex;align-items:center;gap:5px}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--green) var(--p,30%),#DCE6E2 var(--p,30%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--green);box-shadow:var(--sh-2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--green);cursor:pointer}
.sl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}
.mini{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.mini td{padding:5px 0;border-top:1px solid var(--line-2);color:var(--grey)}
.mini td:last-child{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.mini tr.on td{color:var(--green-d)}
.note{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4;color:var(--ink-2);background:var(--wash);border-radius:13px;padding:10px 12px}
.note .ic{width:16px;height:16px;color:var(--green);margin-top:1px}
.note.amb{background:var(--amber-t)}.note.amb .ic{color:var(--amber)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 26px;border-top:1px solid var(--line-2);background:#fff}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint)}
.tabbar div.on{color:var(--navy)}
.tabbar .ic{width:22px;height:22px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.ring{position:relative;width:122px;height:122px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:24px;color:var(--navy);letter-spacing:-.02em;display:block;line-height:1}
.ring .c span{font-size:11px;color:var(--grey);font-weight:600}
.tl{display:flex;justify-content:space-between;position:relative;margin-top:8px}
.tl::before{content:"";position:absolute;left:14px;right:14px;top:11px;height:2px;background:var(--line)}
.tl div{position:relative;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--grey);font-weight:600;gap:3px;text-align:center;line-height:1.2}
.tl i{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.tl .ok i{background:var(--green);border-color:var(--green)}
.tl .now i{background:#fff;border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-t)}
.tl .ic{width:13px;height:13px}
.steps{position:relative;padding-left:4px}
.st{display:flex;gap:11px;position:relative;padding-bottom:12px}
.st:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.st i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--green);color:#fff;position:relative;z-index:1}
.st i .ic{width:13px;height:13px}
.st.wait i{background:#fff;border:2px solid var(--line);color:var(--faint)}
.st b{display:block;font-size:14px;color:var(--ink)}
.st span{font-size:12.5px;color:var(--grey)}
.sheet-bg{position:absolute;inset:0;background:rgba(11,43,60,.45);z-index:15}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;z-index:16;padding:10px 16px 0;box-shadow:0 -10px 30px rgba(11,43,60,.2);max-height:86%;display:flex;flex-direction:column}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#D5DEDA;margin:0 auto 12px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:15px;padding:12px;font-size:14px}
.opt+.opt{margin-top:8px}
.opt.on{border-color:var(--green);background:var(--wash)}
.opt .i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--tint);color:var(--green);flex:none}
.opt .i .ic{width:18px;height:18px}
.opt b{display:block;color:var(--ink)}
.opt span{font-size:12.5px;color:var(--grey)}
.ladder{counter-reset:l}
.ladder div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:5px 0}
.ladder div::before{counter-increment:l;content:counter(l);width:20px;height:20px;border-radius:6px;background:#EEF3F1;color:var(--grey);font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.notif{margin:4px 10px 10px;background:rgba(255,255,255,.96);border-radius:20px;padding:11px 13px;box-shadow:var(--sh-3);display:flex;gap:11px;align-items:flex-start;font-size:13.5px;border:1px solid var(--line-2)}
.notif b{display:block;font-size:14px}
.notif small{color:var(--muted);font-size:11.5px;margin-left:auto}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.2}
.qa i{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--wash);color:var(--green);border:1px solid var(--line-2)}
.qa i .ic{width:21px;height:21px}
.qa .hot i{background:var(--navy);color:var(--mint);border-color:var(--navy)}
.pol{background:var(--navy);color:#fff;border-radius:20px;padding:15px;position:relative;overflow:hidden}
.pol::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(71,215,172,.13)}
.pol .k{font-size:12px;color:#A9C3CF;font-weight:600}
.pol b{font-size:17px;display:block;margin:2px 0 8px}
.pol .chip{background:rgba(71,215,172,.18);color:var(--mint)}
.meter{height:10px;border-radius:9px;background:#E3ECE8;overflow:hidden;margin-top:8px}
.meter div{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--green),var(--mint))}
.conf{display:flex;align-items:center;gap:10px}
.conf .meter{flex:1;margin:0}
.dark{background:#0B1419;color:#fff}
.cam{position:relative;height:100%;background:radial-gradient(120% 80% at 50% 40%,#22333C 0%,#0B1419 70%);display:flex;flex-direction:column}
.cam .top{display:flex;justify-content:space-between;align-items:center;padding:6px 16px}
.cam .top .x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center}
.vf{position:relative;margin:10px 18px 0;border-radius:20px;overflow:hidden;height:300px}
.corner{position:absolute;width:36px;height:36px;border:3px solid var(--mint)}
.corner.tl1{left:12px;top:12px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.corner.tr1{right:12px;top:12px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.corner.bl1{left:12px;bottom:12px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.corner.br1{right:12px;bottom:12px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.readout{background:#fff;color:var(--ink);border-radius:24px 24px 0 0;margin-top:auto;padding:16px 16px 0}
.reading{font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.chk div{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--wash);border-radius:11px;padding:8px 9px;line-height:1.25}
.chk .ic{width:15px;height:15px;color:var(--green)}
.big-ok{width:78px;height:78px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;margin:6px auto 10px;box-shadow:0 0 0 10px var(--tint)}
.big-ok .ic{width:38px;height:38px}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ph div{border-radius:14px;overflow:hidden;position:relative;aspect-ratio:4/3;background:#DCE6E2}
.ph div span{position:absolute;left:6px;bottom:6px;background:rgba(11,43,60,.78);color:#fff;font-size:11px;font-weight:650;border-radius:7px;padding:2px 6px;display:flex;gap:4px;align-items:center}
.ph .ic{width:12px;height:12px;color:var(--mint)}
.cmp{border:1.5px solid var(--line-2);border-radius:18px;padding:13px;position:relative;background:#fff}
.cmp+.cmp{margin-top:9px}
.cmp.hi{border-color:var(--green);box-shadow:0 0 0 4px var(--tint)}
.cmp .ins{display:flex;align-items:center;gap:9px}
.cmp .ins i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;color:#fff;flex:none}
.cmp .ins b{font-size:14.5px;display:block;color:var(--ink)}
.cmp .ins span{font-size:12px;color:var(--grey)}
.cmp .pr{margin-left:auto;text-align:right}
.cmp .pr b{font-size:18px;color:var(--navy);font-variant-numeric:tabular-nums}
.cmp .pr span{display:block;font-size:11px;color:var(--muted)}
.cmp .feat{display:flex;flex-direction:column;gap:4px;margin-top:9px;font-size:12.5px;color:var(--ink-2)}
.cmp .feat div{display:flex;gap:6px;align-items:flex-start}
.cmp .feat .ic{width:14px;height:14px;margin-top:1px}
.ok{color:var(--green)}.bad{color:var(--red)}
.chg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.chg:first-of-type{border-top:0}
.chg i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.chg i .ic{width:15px;height:15px}
.tog{width:44px;height:26px;border-radius:99px;background:var(--green);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.tog.off{background:#CBD6D1}.tog.off::after{right:auto;left:3px}

/* ---------- try it yourself ---------- */
.try{max-width:1200px;margin:0 auto;padding:26px 24px 40px}
.try h1{font-size:34px;letter-spacing:-.03em;color:var(--navy);margin:12px 0 6px}
.try .sub{color:var(--grey);font-size:16px;max-width:760px}
.grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;margin-top:22px;align-items:start}
.panel{background:#fff;border:1px solid var(--line-2);border-radius:22px;padding:20px;box-shadow:var(--sh-1)}
.panel h3{font-size:18px;color:var(--navy);display:flex;align-items:center;gap:9px;margin-bottom:4px}
.panel h3 .i{width:32px;height:32px;border-radius:10px;background:var(--tint);color:var(--green);display:grid;place-items:center}
.panel h3 .ic{width:17px;height:17px}
.panel .d{font-size:13.5px;color:var(--grey);margin-bottom:14px}
.f{margin-top:12px}
.f label{display:flex;justify-content:space-between;font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:7px}
.f label b{color:var(--navy);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:8px 11px;border-radius:10px;font-size:13px;font-weight:650;background:#F1F5F3;color:var(--ink-2)}
.pills button.on{background:var(--navy);color:#fff}
.inp{width:100%;height:42px;border-radius:11px;border:1.5px solid var(--line);padding:0 12px;font:inherit;font-size:15px;font-weight:650;color:var(--navy);font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--green)}
.out{margin-top:14px;border-radius:16px;background:var(--wash);padding:14px}
.route{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.route div{display:flex;gap:10px;align-items:flex-start;border-radius:13px;padding:10px 12px;background:#F4F8F6;font-size:13.5px;color:var(--ink-2)}
.route div.on{background:var(--navy);color:#fff}
.route div.on b{color:var(--mint)}
.route b{display:block;color:var(--ink);font-size:14px}
.route .ic{width:17px;height:17px;margin-top:2px;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink-2);padding:6px 0}
.sw .tog{cursor:pointer}
svg.chart text{font-family:var(--f);font-size:11px;fill:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:var(--sh-3);opacity:0;transition:.25s var(--ease);z-index:99;display:flex;gap:8px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1180px){.stage{grid-template-columns:1fr auto}.stage .side.l{display:none}}
@media (max-width:980px){.hero{grid-template-columns:1fr}.heroart{display:none}.grid3{grid-template-columns:1fr}.stage{grid-template-columns:1fr}.stage .side{display:none}.how{grid-template-columns:1fr}}
@media (max-width:760px){
  .topbar .disc,.topbar .hide-s{display:none}
  .topbar{gap:8px;padding:0 10px}
  .hero h1{font-size:40px}
  .demo{padding:0}
  .story{border-radius:0;grid-template-columns:1fr;padding:12px 14px;gap:6px}
  .story .arrow,.story .dots{display:none}
  .story h2{font-size:17px}.story p{font-size:13px}
  .forxyz{font-size:12.5px;padding:7px 10px}
  .stage{margin-top:0;gap:0}
  .phone{width:100vw;height:calc(100vh - 48px - var(--sh,170px) - 58px);border-radius:0;padding:0;box-shadow:none;background:#fff}
  .phone::before,.island,.sb{display:none}
  .screen{border-radius:0}
  .mnav{display:flex!important}
}
.more{display:none;margin-left:6px;font-size:12px;font-weight:700;color:var(--mint);text-decoration:underline}
@media (max-width:760px){
  .more{display:inline}
  .story p,.story .before,.story .fx{display:none}
  .story.open p,.story.open .before{display:block}.story.open .fx{display:inline}
  .forxyz{background:none;padding:0;margin-top:6px}
  .coach{display:none}
  .pwrap{width:100%;height:auto}.pwrap .phone{position:static;transform:none}
}
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--navy);z-index:60;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-size:13px;font-weight:600}
.mnav button{height:40px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.12);display:flex;align-items:center;gap:6px}
.mnav button.n{background:#fff;color:var(--navy)}
.mnav .ic{width:17px;height:17px}

/* shot mode: phone only, for the slide images */
body.shotmode{background:transparent}
body.shotmode .phone{box-shadow:none}
</style>

const ic = (n, cls) => (ICONS[n] || "").replace('class="ic"', 'class="ic' + (cls ? " " + cls : "") + '"');
const R = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const KM = (n) => Math.round(n).toLocaleString("en-IN");

/* ---------- the pricing rule (same as the deck) ---------- */
// Refund = quote - (40% of quote + 60% of quote spread over 12,000 km x km driven), never below zero.
const QUOTE = 10000, TP = 3416, CAP = 12000;
function price(km, quote = QUOTE){
  const fixed = 0.4 * quote, rate = (0.6 * quote) / CAP, used = Math.min(km, CAP) * rate;
  const cost = Math.min(quote, fixed + used);
  return { fixed, rate, used, cost, back: quote - cost, share: (quote - cost) / quote };
}

function ringSvg(frac, s){
  const r = s / 2 - 9, c = 2 * Math.PI * r;

}

function claimRoute(){
  const out = [];
  if (T.fraud) out.push({icon:"warn", t:"Fraud team first", d:"Suspected fraud always goes to a person before anything else.", on:true});
  const senior = T.injury || T.tp || T.theft || T.conf < 75;
  if (T.amt >= 50000) out.push({icon:"usercheck", t:"Licensed surveyor visit", d:"Required by law from ₹50,000. The AI draft is shared with the surveyor.", on:!T.fraud});
  else if (senior) out.push({icon:"usercheck", t:"Senior assessor", d:(T.conf < 75 ? "Low AI confidence. " : "") + (T.injury || T.tp || T.theft ? "Injury, third party, theft or total loss. " : "") + "Checks the file in full.", on:!T.fraud});
  else if (T.amt >= 40000) out.push({icon:"wrench", t:"Assessor checks at the garage", d:"Above XYZ's photo-only limit but below the surveyor line.", on:!T.fraud});
  else out.push({icon:"camera", t:"Photo route, assessor approves", d:"A claims assessor checks the AI draft and approves or changes it. Target: 3 working days.", on:!T.fraud});
  out.push({icon:"list", t:"Logged for the pilot", d:"Whether the person changed the AI's estimate, at this confidence level.", on:false});
  return out;
}

function fit(){
  const s = document.querySelector(".story"), w = document.querySelector(".pwrap"); if (!s || !w) return;
  const de = document.documentElement;
  if (innerWidth <= 760){ de.style.setProperty("--ps", 1); de.style.setProperty("--sh", s.offsetHeight + "px"); return; }
  const top = w.getBoundingClientRect().top + scrollY, avail = innerHeight - top - 18;
  de.style.setProperty("--ps", Math.max(0.6, Math.min(1, avail / 844)).toFixed(3));
}
window.addEventListener("resize", () => { if (MODE === "demo") fit(); });
function parse(){
  const q = new URLSearchParams(location.search);
  if (q.get("shot")){ SHOT = true; STEP = Math.max(1, Math.min(N, +q.get("shot"))); return; }
  const h = location.hash.replace(/^#\/?/, "").split("/");
  if (h[0] === "demo"){ MODE = "demo"; STEP = Math.max(1, Math.min(N, +h[1] || 1)); }
  else if (h[0] === "try"){ MODE = "try"; }
  else MODE = "land";
}
function go(n){ STEP = Math.max(1, Math.min(N, n)); if (STEP === 2) KMV = 6000; location.hash = "#/demo/" + STEP; }
function toast(t){ const el = document.getElementById("toast"); el.innerHTML = ic("info") + t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 1800); }
function bind(){
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = (e) => {
    e.preventDefault(); const g = b.dataset.go;
    if (g === "next") go(STEP + 1); else if (g === "prev") go(STEP - 1); else if (g === "restart") go(1);
    else toast("In this demo, Riya keeps her photo");
  });
  const mo = document.querySelector("[data-more]"); if (mo) mo.onclick = () => { document.querySelector(".story").classList.toggle("open"); fit(); };
  document.querySelectorAll("[data-step]").forEach((b) => b.onclick = () => go(+b.dataset.step));
  const hot = document.getElementById("hot"); if (hot) { hot.style.cursor = "pointer"; hot.onclick = () => go(STEP + 1); }
  const ks = document.getElementById("kms");
  if (ks) ks.oninput = () => { KMV = +ks.value; const p = price(KMV); ks.style.setProperty("--p", ((KMV - 2000) / 13000 * 100) + "%");
    document.getElementById("kmv").textContent = KM(KMV) + " km"; document.getElementById("tb").textContent = R(p.back); document.getElementById("tc").textContent = R(p.cost);
    const b = document.getElementById("bar").children; b[0].style.flex = p.fixed; b[1].style.flex = p.used; b[1].textContent = p.used > 900 ? R(p.used) : ""; b[2].style.flex = Math.max(p.back, 0.0001); b[2].textContent = p.back > 900 ? R(p.back) : ""; };
  // try page
  document.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { const [k, v] = b.dataset.t.split(":");
    if (k === "flag") T[v] = !T[v]; else { T[k] = v; T.quote = null; } render(); });
  const num = (id, key, after) => { const el = document.getElementById(id); if (el) el.onchange = () => { const v = parseInt(el.value.replace(/[^0-9]/g, ""), 10); if (!isNaN(v)) { T[key] = v; if (after) after(); } render(); }; };
  num("tq", "quote"); num("to", "open"); num("tc2", "close");
  [["tk", "km"], ["ta", "amt"], ["tf", "conf"]].forEach(([id, key]) => { const el = document.getElementById(id); if (el) el.onchange = el.oninput = () => { T[key] = +el.value; render(); const n = document.getElementById(id); n.focus(); }; });
}
document.addEventListener("keydown", (e) => {
  if (MODE !== "demo" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") go(STEP + 1); if (e.key === "ArrowLeft") go(STEP - 1);
});
window.addEventListener("hashchange", () => { parse(); render(); window.scrollTo(0, 0); });
parse(); render();
</script>
